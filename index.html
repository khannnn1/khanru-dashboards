<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Khanru</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <meta name="theme-color" content="#f7ede4">
  <link rel="stylesheet" href="css/estilo.css?v=202611072336">
  <!-- Aplica o tema salvo antes de a página aparecer -->
  <script src="js/tema.js?v=202611072336"></script>
</head>
<body class="pagina-login">
  <main class="cartao cartao-login">
    <h1>Khanru 💞</h1>
    <p class="subtitulo">Entre no seu dashboard</p>

    <form id="form-login" novalidate>
      <label class="campo">
        <span>E-mail</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="campo">
        <span>Senha</span>
        <input type="password" name="senha" autocomplete="current-password" required>
      </label>
      <button class="botao" type="submit">Entrar</button>
    </form>

    <p id="mensagem" class="mensagem" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=202611072336"></script>
  <script src="js/menu.js?v=202611072336"></script>
  <script src="js/sessao.js?v=202611072336"></script>
  <script>
    const form = document.getElementById("form-login");
    const mensagem = document.getElementById("mensagem");
    const botao = form.querySelector("button");

    // Quem já está logado vai direto para o dashboard.
    obterCliente().auth.getSession().then(({ data }) => {
      if (data.session) location.replace(PAGINA_INICIAL);
    });

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const email = form.email.value.trim();
      const senha = form.senha.value;

      if (!email || !senha) {
        mensagem.textContent = "Preencha e-mail e senha.";
        return;
      }

      botao.disabled = true;
      mensagem.textContent = "Entrando...";

      const { error } = await obterCliente().auth.signInWithPassword({ email, password: senha });

      if (error) {
        mensagem.textContent = traduzirErroLogin(error);
        botao.disabled = false;
        return;
      }
      location.replace(PAGINA_INICIAL);
    });
  </script>
</body>
</html>
