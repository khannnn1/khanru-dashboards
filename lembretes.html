<!DOCTYPE html>
<html lang="pt-BR" class="carregando">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lembretes · Khanru</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <meta name="theme-color" content="#f7ede4">
  <link rel="stylesheet" href="css/estilo.css?v=202611072344">
  <!-- Aplica o tema salvo antes de a página aparecer -->
  <script src="js/tema.js?v=202611072344"></script>
</head>
<body>
  <div class="layout">
    <nav id="menu" class="menu" aria-label="Menu principal"></nav>

    <main class="conteudo">
      <header class="cabecalho-pagina cabecalho-com-acao">
        <div>
          <h1>Lembretes</h1>
          <p>Coisas para não esquecer. 💞 marca os lembretes que seu par compartilhou.</p>
        </div>
        <button id="botao-notificacoes" class="botao botao-secundario" type="button" hidden>🔔 Ativar notificações</button>
      </header>

      <section class="cartao">
        <form id="form-lembrete" class="form-lembrete" novalidate>
          <label class="campo campo-texto-lembrete">
            <span>Novo lembrete</span>
            <input name="texto" type="text" maxlength="500" placeholder="Ex.: comprar pão" required>
          </label>
          <label class="campo">
            <span>Quando (opcional)</span>
            <input name="quando" type="datetime-local">
          </label>
          <button class="botao" type="submit">Adicionar</button>
          <label class="campo-check">
            <input name="compartilhar" type="checkbox">
            <span>Compartilhar com meu par</span>
          </label>
        </form>
        <p id="mensagem-lembrete" class="mensagem mensagem-esquerda" role="status"></p>
      </section>

      <div id="abas-lembretes" class="abas" role="tablist" aria-label="Filtrar lembretes">
        <button type="button" role="tab" data-aba="hoje" aria-selected="true">Hoje</button>
        <button type="button" role="tab" data-aba="proximos" aria-selected="false">Próximos</button>
        <button type="button" role="tab" data-aba="feitos" aria-selected="false">Feitos</button>
      </div>

      <ul id="lista-lembretes" class="lista-lembretes" aria-live="polite">
        <li class="vazio">Carregando...</li>
      </ul>
    </main>
  </div>

  <!-- A ordem importa: biblioteca, configuração, menu, notificações, sessão, página -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=202611072344"></script>
  <script src="js/menu.js?v=202611072344"></script>
  <script src="js/notificacoes.js?v=202611072344"></script>
  <script src="js/sessao.js?v=202611072344"></script>
  <script src="js/lembretes.js?v=202611072344"></script>
  <script>
    protegerPagina().then((sessao) => {
      if (!sessao) return;
      prepararBotaoNotificacoes(document.getElementById("botao-notificacoes"), sessao.usuario);
      iniciarLembretes(sessao.usuario);
    });
  </script>
</body>
</html>
