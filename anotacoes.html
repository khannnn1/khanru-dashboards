<!DOCTYPE html>
<html lang="pt-BR" class="carregando">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anotações · Khanru</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="layout">
    <nav id="menu" class="menu" aria-label="Menu principal"></nav>

    <main class="conteudo conteudo-largo">
      <header class="cabecalho-pagina">
        <h1>Anotações</h1>
        <p>Suas notas são privadas: só você vê. Tudo salva sozinho enquanto você escreve.</p>
      </header>

      <div id="pagina-notas" class="pagina-notas">
        <section class="cartao painel-lista-notas" aria-label="Lista de notas">
          <div class="barra-notas">
            <input id="busca-notas" class="campo-busca" type="search" placeholder="Buscar nas notas" aria-label="Buscar nas notas">
            <button id="botao-nova-nota" class="botao" type="button">+ Nova</button>
          </div>
          <ul id="lista-notas" class="lista-notas">
            <li class="vazio">Carregando...</li>
          </ul>
        </section>

        <section id="editor-nota" class="cartao editor-nota" aria-label="Editor da nota" hidden>
          <div class="barra-editor">
            <button id="botao-voltar-notas" class="botao botao-secundario botao-voltar" type="button">← Notas</button>
            <span id="estado-salvamento" class="estado-salvamento" role="status"></span>
            <button id="botao-fixar" class="botao botao-secundario" type="button" aria-pressed="false">📌 Fixar no topo</button>
            <button id="botao-apagar-nota" class="botao botao-perigo" type="button">Apagar</button>
          </div>
          <input id="nota-titulo" class="nota-titulo" type="text" maxlength="200" placeholder="Título" aria-label="Título da nota">
          <textarea id="nota-conteudo" class="nota-conteudo" placeholder="Escreva aqui..." aria-label="Texto da nota"></textarea>
        </section>

        <section class="cartao editor-vazio" aria-hidden="true">
          <p>Escolha uma nota ou crie uma nova.</p>
        </section>
      </div>
    </main>
  </div>

  <!-- A ordem importa: biblioteca, configuração, menu, notificações, sessão, página -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/notificacoes.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/anotacoes.js"></script>
  <script>
    protegerPagina().then((sessao) => {
      if (sessao) iniciarAnotacoes();
    });
  </script>
</body>
</html>
